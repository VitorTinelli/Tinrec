name: Windows desktop
on:
  push:
    paths: ['desktop-app/**', 'desktop-rust/**', 'scripts/*windows*.ps1', 'package*.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop-app/**', 'desktop-rust/**', 'scripts/*windows*.ps1', 'package*.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri
      - name: Prepare pinned encoder
        shell: pwsh
        run: |
          ./scripts/prepare-windows-ffmpeg.ps1
          (Resolve-Path desktop-app/src-tauri/resources/windows/bin).Path | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run desktop:web:build
      - run: npx vitest run desktop-app/src --maxWorkers=1
      - run: cargo fmt --manifest-path desktop-app/src-tauri/Cargo.toml --check
      - run: cargo fmt --manifest-path desktop-rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path desktop-app/src-tauri/Cargo.toml --all-targets --features custom-protocol -- -D warnings
      - run: cargo clippy --locked --manifest-path desktop-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path desktop-app/src-tauri/Cargo.toml --features custom-protocol -- --include-ignored --test-threads=1
      - run: cargo test --locked --manifest-path desktop-rust/Cargo.toml -- --include-ignored --test-threads=1
      - name: Build installer
        run: npm run desktop:package -- --bundles nsis
      - name: Test existing-installation guard
        shell: pwsh
        run: ./scripts/test-windows-installed-guard.ps1
      - name: Test installed application and WebView IPC
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          ./scripts/test-windows-installed.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tinrec-Windows-x64
          path: |
            desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe
            .tools/installed-test-*/data/self-test-result.json
          if-no-files-found: warn
