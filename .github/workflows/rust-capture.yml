name: Rust capture prototype
on:
  push:
    paths: ['desktop-rust/**', '.github/workflows/rust-capture.yml']
  pull_request:
    paths: ['desktop-rust/**', '.github/workflows/rust-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libpipewire-0.3-dev libasound2-dev ffmpeg
      - name: macOS encoder
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows encoder
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Use native Windows encoder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $encoder = Get-ChildItem "$env:ChocolateyInstall/lib/ffmpeg*/tools" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (!$encoder) { throw 'FFmpeg executable not found' }
          if (!(Test-Path (Join-Path $encoder.DirectoryName 'ffprobe.exe'))) { throw 'ffprobe executable not found' }
          # Child::kill must target FFmpeg itself, not the Chocolatey launcher.
          $encoder.DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Native encoder directory: $($encoder.DirectoryName)"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Capture engine tests
        timeout-minutes: 10
        run: cargo test --locked -- --include-ignored --nocapture --test-threads=1
      - run: cargo build --locked --release
      - name: Upload diagnostic CLI
        uses: actions/upload-artifact@v4
        with:
          name: tinrec-capture-${{ matrix.os }}
          path: |
            desktop-rust/target/release/tinrec-capture
            desktop-rust/target/release/tinrec-capture.exe
          if-no-files-found: error
