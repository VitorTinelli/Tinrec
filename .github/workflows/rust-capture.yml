name: Rust capture prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libpipewire-0.3-dev libasound2-dev ffmpeg
      - name: macOS encoder
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows encoder
        if: runner.os == 'Windows'
        run: ../scripts/prepare-windows-ffmpeg.ps1
      - name: Use native Windows encoder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          (Resolve-Path ../desktop-app/src-tauri/resources/windows/bin).Path | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Capture engine tests
        timeout-minutes: 10
        run: cargo test --locked -- --include-ignored --nocapture --test-threads=1
      - run: cargo build --locked --release
      - name: Upload diagnostic CLI
        uses: actions/upload-artifact@v4
        with:
          name: tinrec-capture-${{ matrix.os }}
          path: |
            desktop-rust/target/release/tinrec-capture
            desktop-rust/target/release/tinrec-capture.exe
          if-no-files-found: error
