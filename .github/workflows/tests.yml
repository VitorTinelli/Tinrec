name: Application tests
on:
  push:
    paths:
      [
        "src/**",
        "server/**",
        "api/**",
        "tests/**",
        "desktop-app/src/**",
        "*.json",
        "*config.ts",
        "desktop-app/*config*",
        ".github/workflows/tests.yml",
      ]
  pull_request:
    paths:
      [
        "src/**",
        "server/**",
        "api/**",
        "tests/**",
        "desktop-app/src/**",
        "*.json",
        "*config.ts",
        "desktop-app/*config*",
        ".github/workflows/tests.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run desktop:web:build
