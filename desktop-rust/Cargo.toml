[package]
name = "tinrec-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
ctrlc = "3"
pinray = "=0.2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
pinray-platform-linux = { path = "vendor/pinray-platform-linux" }
